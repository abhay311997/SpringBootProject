#[Application]
spring.application.name=springbasics
server.port=5454
# Hides the stack trace
spring.web.error.include-stacktrace=never
# Always include the custom message (e.g., "Student with roll number 1 Not Exist.")
spring.web.error.include-message=always
# Hides internal exception class name
spring.web.error.include-exception=false